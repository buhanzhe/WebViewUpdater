plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buhanzhe.webviewupdater'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buhanzhe.webviewupdater'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '0.1.1'

    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
